model:
    type: "yolov5"
    onnx_file:     "../weights/ALL_GEN_person.axmodel"
    BATCH_SIZE:    1
    INPUT_CHANNEL: 3
    IMAGE_WIDTH:   640
    IMAGE_HEIGHT:  640
    obj_threshold: 0.1
    nms_threshold: 0.45
    agnostic:      True
    isbox:         True
    isslice:       False
    strides:       [8, 16, 32]
    num_anchors:   [3,  3,  3]
    anchors:       [[10,13], [16,30], [33,23], [30,61], [62,45], [59,119], [116,90], [156,198], [373,326]]
    lables: 
        - "header"
        - "persion"

tracker:
    max_age:       70
    iou_threshold: 0.3
    sim_threshold: 0.4
    agnostic:      True
    labels_file:   "../configs/ALL_GEN_person.names"


