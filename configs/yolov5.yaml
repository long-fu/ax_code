model:
    file:  "../weights/BRH_agentPose.axmodel"
    type:  "yolov5"
    labels:   ["person"]
    inputs:   [1, 3, 640 ,640]
    obj_threshold: 0.25
    nms_threshold: 0.7
    isslice:       False
    strides:       [8, 16, 32]
